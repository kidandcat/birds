name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        run: |
          mkdir -p dist/flight-macos-arm64
          cp target/aarch64-apple-darwin/release/flight dist/flight-macos-arm64/flight
          cp -r assets dist/flight-macos-arm64/
          chmod +x dist/flight-macos-arm64/flight
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/flight-macos-arm64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir dist\flight-windows
          copy target\release\flight.exe dist\flight-windows\flight.exe
          xcopy assets dist\flight-windows\assets /E /I
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/flight-windows

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist/flight-linux
          cp target/release/flight dist/flight-linux/flight
          cp -r assets dist/flight-linux/
          chmod +x dist/flight-linux/flight
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/flight-linux

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        run: |
          mkdir -p release
          cd artifacts/macos-arm64 && zip -r ../../release/flight-macos-arm64.zip . && cd ../..
          cd artifacts/windows && zip -r ../../release/flight-windows.zip . && cd ../..
          cd artifacts/linux && zip -r ../../release/flight-linux.zip . && cd ..
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          files: |
            release/flight-macos-arm64.zip
            release/flight-windows.zip
            release/flight-linux.zip
          make_latest: true

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build landing page
        run: |
          mkdir -p _site
          cp docs/index.html _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
