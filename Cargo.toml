[package]
name = "flight"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14", features = [] }
rand = "0.8"
flight-shared = { path = "shared" }
bincode = "1"

[workspace]
members = ["shared", "server"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.fast]
inherits = "dev"
opt-level = 1
debug = false
